<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IMFT – Chat with rReplay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- REAL RECAPTCHA ENTERPRISE -->
<script src="https://www.google.com/recaptcha/api.js" async defer></script>


<style>
/* ====== THEME VARIABLES ====== */
:root {
  --bg-main: #050505;
  --bg-elevated: #101010;
  --bg-glass: rgba(20, 20, 20, 0.9);
  --accent: #4caf50;
  --accent-soft: #2f8f3a;
  --text-main: #f5f5f5;
  --text-muted: #aaaaaa;
  --border-subtle: #222;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: var(--bg-main);
  color: var(--text-main);
  font-family: system-ui, sans-serif;
}

#app {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100vh;
  background: radial-gradient(circle at top, #0b1b0b 0%, #020302 55%, #000 100%);
}

/* ====== SIDEBAR ====== */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: 230px;
  height: 100vh;
  background: #0a0a0a;
  border-right: 1px solid #1a1a1a;
  padding: 20px 0;
  transform: translateX(-100%);
  transition: 0.25s ease;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.sidebar.open { transform: translateX(0); }

.sidebar-main,
.sidebar-bottom {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.sidebar-main { margin-top: 40px; }
.sidebar-bottom { margin-bottom: 20px; }

.sidebar-item {
  width: 100%;
  padding: 12px 16px;
  background: transparent;
  border: none;
  color: var(--text-main);
  font-size: 0.95rem;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}

.sidebar-item:hover {
  background: rgba(76, 175, 80, 0.12);
}

.sidebar-toggle {
  position: fixed;
  top: 14px;
  left: 14px;
  z-index: 10000;
  background: #0a0a0a;
  border: 1px solid #1a1a1a;
  color: var(--accent);
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 1.2rem;
}

/* ====== TOP BAR ====== */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: #050505;
  border-bottom: 1px solid var(--border-subtle);
  position: relative;
  overflow: visible;
}

.top-title {
  font-weight: 600;
  color: var(--accent);
  margin-left: 40px;
}

/* ====== CONTACT BUTTON ====== */
#contactToggle {
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid rgba(76, 175, 80, 0.6);
  background: rgba(10, 20, 10, 0.35);
  color: #b9ffbf;
  font-size: 0.85rem;
  cursor: pointer;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

/* ====== CONTACT POPUP ====== */
#contactPopup {
  position: absolute;
  right: 16px;
  top: 110%;
  width: 260px;
  padding: 14px;
  background: rgba(15, 25, 15, 0.75);
  border-radius: 14px;
  border: 1px solid rgba(76, 175, 80, 0.35);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.7);
  display: none;
  flex-direction: column;
  gap: 10px;
  z-index: 9999;
}

.contact-label { font-size: 0.75rem; color: var(--text-muted); }

.contact-input,
.contact-textarea {
  background: #050505;
  border-radius: 8px;
  border: 1px solid var(--border-subtle);
  padding: 6px 8px;
  color: var(--text-main);
}

.contact-send {
  margin-top: 6px;
  width: 100%;
  padding: 6px 0;
  border-radius: 999px;
  border: none;
  background: var(--accent);
  color: #000;
  font-weight: 600;
  cursor: pointer;
}

/* ====== CHAT AREA ====== */
.chat-wrapper { flex: 1; overflow: hidden; }

.chat-area {
  flex: 1;
  padding: 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.msg {
  max-width: 80%;
  padding: 8px 11px;
  border-radius: 12px;
  font-size: 0.9rem;
  line-height: 1.4;
}

.msg.user {
  margin-left: auto;
  background: var(--accent);
  color: #000;
}

.msg.bot {
  margin-right: auto;
  background: var(--bg-elevated);
}

/* ====== TYPING INDICATOR ====== */
.typing-indicator {
  display: none;
  align-items: center;
  gap: 6px;
  padding: 10px 14px;
  width: fit-content;
  background: rgba(20, 30, 20, 0.55);
  border-radius: 14px;
  border: 1px solid rgba(76, 175, 80, 0.25);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  margin-top: 6px;
}

.typing-indicator .dot {
  width: 8px;
  height: 8px;
  background: #7dff8a;
  border-radius: 50%;
  animation: typingBlink 1.4s infinite both;
}

.typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingBlink {
  0% { opacity: 0.2; transform: translateY(0); }
  20% { opacity: 1; transform: translateY(-3px); }
  100% { opacity: 0.2; transform: translateY(0); }
}

/* ====== BOTTOM BAR ====== */
.bottom-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-top: 1px solid var(--border-subtle);
  background: #050505;
}

#chatInput {
  flex: 1;
  border-radius: 999px;
  border: 1px solid var(--border-subtle);
  background: #050505;
  color: var(--text-main);
  padding: 8px 12px;
}

.send-btn {
  width: 34px;
  height: 34px;
  border-radius: 999px;
  border: none;
  background: var(--accent);
  color: #000;
  cursor: pointer;
}

/* ====== PAGE OVERLAY ====== */
.page-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(5, 5, 5, 0.96);
  backdrop-filter: blur(6px);
  display: none;
  flex-direction: column;
  padding: 40px;
  z-index: 9000;
}

.page-overlay h1 { color: var(--accent); }
</style>

</head>

<body>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">

  <div class="sidebar-main">
    <button class="sidebar-item" id="navConversation">💬 Conversation</button>
  </div>

  <div class="sidebar-bottom">
    <button class="sidebar-item" id="navAbout">ℹ️ About</button>
    <button class="sidebar-item" id="navSettings">⚙️ Settings</button>
  </div>

</div>

<button id="sidebarToggle" class="sidebar-toggle">☰</button>

<div id="app">

  <!-- TOP BAR -->
  <header class="top-bar">
    <div class="top-title">Chat with rReplay</div>
    <button id="contactToggle" class="contact-btn">Contact Me</button>

    <!-- CONTACT POPUP -->
    <div id="contactPopup" class="contact-popup">

      <label class="contact-label">Your email
        <input type="email" id="contactEmail" class="contact-input">
      </label>

      <label class="contact-label">Your message
        <textarea id="contactMessage" class="contact-textarea"></textarea>
      </label>

      <button class="contact-send">Send</button>
    </div>
  </header>

  <!-- CHAT -->
  <main class="chat-wrapper">

    <div id="chatArea" class="chat-area">

      <!-- TYPING BUBBLE (MUST BE INSIDE chatArea) -->
      <div id="typingIndicator" class="typing-indicator" style="display:none;">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

    </div>

  </main>

  <!-- INPUT -->
  <footer class="bottom-bar">
    <input id="chatInput" type="text" placeholder="Send a message...">
    <button id="sendBtn" class="send-btn">➤</button>
  </footer>

</div>


<script>
/* === AI PERSONALITY === */
const AI_PERSONALITY = `
You are rReplay, an AI assistant.
You speak clearly, helpfully, and with confidence.
You keep answers short and simple unless the user asks for detail.
You, the AI on the website imformaltime.com (nothing else. Not informalTime, just imformaltime.com), were made by Eidan, a developer who loves coding.
You, the AI model itself, were developed by Meta.
You reason like ChatGPT, have the real-time edge of Grok, and the vast context of Gemini.
`;

/* ====== BACKEND CHAT ====== */
async function sendMessage(message) {
  const response = await fetch("https://llama-backend-1-qq3f.onrender.com/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      message: AI_PERSONALITY + "\nUser: " + message
    })
  });

  const data = await response.json();
  return data.reply;
}

/* ====== CHAT LOGIC ====== */
const chatArea = document.getElementById("chatArea");
const chatInput = document.getElementById("chatInput");
const sendBtn = document.getElementById("sendBtn");
const typing = document.getElementById("typingIndicator");

async function handleSend() {
  const text = chatInput.value.trim();
  if (!text) return;

  chatArea.innerHTML += `<div class="msg user">${escapeHtml(text)}</div>`;
  chatInput.value = "";

  typing.style.display = "flex";
  chatArea.appendChild(typing);
  chatArea.scrollTop = chatArea.scrollHeight;

  try {
    const reply = await sendMessage(text);

    typing.style.display = "none";

    chatArea.innerHTML += `<div class="msg bot">${escapeHtml(reply)}</div>`;
  } catch {
    typing.style.display = "none";
    chatArea.innerHTML += `<div class="msg bot">Error: Could not reach rReplay.</div>`;
  }

  chatArea.scrollTop = chatArea.scrollHeight;
}

sendBtn.onclick = handleSend;
chatInput.onkeydown = e => {
  if (e.key === "Enter") handleSend();
};

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
}

/* ====== SIDEBAR ====== */
const sidebar = document.getElementById("sidebar");
document.getElementById("sidebarToggle").onclick = () => {
  sidebar.classList.toggle("open");
};

/* ====== PAGE OVERLAY SYSTEM ====== */
function openPage(title, content) {
  let overlay = document.getElementById("pageOverlay");

  if (!overlay) {
    overlay = document.createElement("div");
    overlay.id = "pageOverlay";
    overlay.className = "page-overlay";
    document.body.appendChild(overlay);
  }

  overlay.innerHTML = `
    <h1>${title}</h1>
    ${content}
    <button class="closePage">Close</button>
  `;

  overlay.style.display = "flex";

  overlay.querySelector(".closePage").onclick = () => {
    overlay.style.display = "none";
  };
}

/* ====== ABOUT / SETTINGS ====== */
document.getElementById("navConversation").onclick = () => {
  sidebar.classList.remove("open");
};

document.getElementById("navAbout").onclick = () => {
  sidebar.classList.remove("open");
  openPage("About", `
    <p>
      Hello from rReplay! rReplay is a small AI model developed by me (duh),
      and can do some basic tasks. Heres one tip: Don't ask it to code anything
      for you! rReplay is TERRIBLE at coding!
    </p>
  `);
};

document.getElementById("navSettings").onclick = () => {
  sidebar.classList.remove("open");
  openPage("Settings", `<p>Coming Soon...</p>`);
};

/* ====== CONTACT POPUP ====== */
const contactPopup = document.getElementById("contactPopup");
const contactToggle = document.getElementById("contactToggle");

contactToggle.onclick = (e) => {
  e.stopPropagation();
  contactPopup.style.display =
    contactPopup.style.display === "flex" ? "none" : "flex";
};

document.addEventListener("click", (e) => {
  if (!contactPopup.contains(e.target) &&
      !contactToggle.contains(e.target)) {
    contactPopup.style.display = "none";
  }
});
</script>

</body>


</html>
