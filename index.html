<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IMFT | Under Construction</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Google Enterprise reCAPTCHA (checkbox version) -->
<script src="https://www.google.com/recaptcha/enterprise.js" async defer></script>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">

<style>
/* ===========================
   COLOR THEME
=========================== */
:root {
    --green-dark: #1b3d2f;
    --green-mid: #2e5e44;
    --green-light: #a8d5ba;
    --green-accent: #7ecf8a;
    --green-bg: #e8f5e9;
}

/* ===========================
   GLOBAL
=========================== */
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at center, var(--green-bg) 0%, var(--green-light) 100%);
    color: var(--green-dark);
    font-family: 'Montserrat', sans-serif;
    perspective: 2000px;
}

/* ===========================
   FLOATING GREEN SPIRITS
=========================== */
#vortex-container {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    pointer-events: none;
}

.spirit {
    position: absolute;
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    color: var(--green-mid);
    opacity: 0.35;
    font-size: 22px;
    user-select: none;
    transition: opacity 1s linear;
}

/* ===========================
   MAIN CONTENT
=========================== */
#content {
    position: relative;
    z-index: 10000;
    text-align: center;
    top: 50%;
    transform: translateY(-42%);
    width: 100%;
}

.imft-title {
    font-family: 'Cinzel', serif;
    font-size: 10vw;
    font-weight: 900;
    letter-spacing: 40px;
    padding-left: 40px;
    margin-bottom: 10px;
    background: linear-gradient(
        to bottom,
        var(--green-dark) 0%,
        var(--green-mid) 40%,
        var(--green-accent) 50%,
        var(--green-mid) 60%,
        var(--green-dark) 100%
    );
    background-size: 200% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: texture-shift 12s ease-in-out infinite, breath 8s ease-in-out infinite;
    filter: drop-shadow(0 20px 40px rgba(0,0,0,0.1));
}

.uc-text {
    font-family: 'Cinzel', serif;
    font-size: 2.2rem;
    font-weight: 900;
    margin-top: 10px;
    color: var(--green-dark);
    text-shadow: 0 3px 6px rgba(0,0,0,0.15);
}

#countdown {
    margin-top: 15px;
    font-size: 1.8rem;
    font-weight: 900;
    color: var(--green-dark);
}

/* ===========================
   RED GAME BUTTON
=========================== */
#gameButton {
    margin-top: 20px;
    padding: 12px 22px;
    background: linear-gradient(145deg, #ff4d4d, #e63232);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 1.1rem;
    font-weight: 800;
    cursor: pointer;
    transition: 0.2s;
    box-shadow:
        inset 0 1px 2px rgba(255,255,255,0.4),
        inset 0 -2px 4px rgba(0,0,0,0.25),
        0 4px 10px rgba(0,0,0,0.25);
}

#gameButton:hover {
    background: #ff2e2e;
    transform: scale(1.05);
}

/* ===========================
   CONTACT BOX (RIGHT CENTER)
=========================== */
#email-box {
    position: fixed;
    top: 50%;
    right: 20px;
    transform: translateY(-50%);
    background: var(--green-light);
    padding: 14px 18px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 30000;
    width: 320px;
}

#email-box input {
    padding: 8px;
    border-radius: 6px;
    border: 1px solid var(--green-mid);
    outline: none;
}

/* ===========================
   GAME POPUP
=========================== */
#gameModal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 50000;
}

#gameContainer {
    background: #222;
    padding: 10px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(255,255,255,0.2);
}

#closeGame {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 2rem;
    color: white;
    cursor: pointer;
    font-weight: 900;
}

/* ===========================
   ANIMATIONS
=========================== */
@keyframes texture-shift {
    0%, 100% { background-position: 50% 0%; }
    50% { background-position: 50% 100%; }
}

@keyframes breath {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
}
</style>
</head>

<body>

<!-- PARTICLE BACKGROUND -->
<div id="vortex-container"></div>

<!-- MAIN CONTENT -->
<div id="content">

    <h1 class="imft-title">IMFT</h1>

    <h2 class="uc-text">imformaltime.com is under construction!</h2>

    <div id="countdown">Loading countdown…</div>

    <button id="gameButton">Play some games in the meantime!</button>
</div>

<!-- CONTACT BOX WITH REAL GOOGLE CHECKBOX -->
<div id="email-box">
    <form id="contactForm" onsubmit="return handleSubmit(event)">
        <input type="email" id="emailInput" placeholder="Your email" required>
        <input type="text" id="msgInput" placeholder="Your message" required>

        <!-- REAL GOOGLE ENTERPRISE CHECKBOX -->
        <div class="g-recaptcha"
             data-sitekey="6Lf3XXAsAAAAAChuvJqCCoyL8GwS2y1B5tTIRqHY">
        </div>

        <input type="submit" value="Send" style="
            margin-top: 8px;
            padding: 8px 12px;
            background: var(--green-mid);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
        ">
    </form>
</div>

<!-- GAME MODAL -->
<div id="gameModal">
    <div id="closeGame">✖</div>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>
</div>

<script>
/* ===========================
   COUNTDOWN
=========================== */
const targetDate = new Date("2026-03-29T00:00:00");

function updateCountdown() {
    const now = new Date();
    const diff = targetDate - now;

    if (diff <= 0) {
        countdown.innerText = "The site may be ready any moment now!";
        return;
    }

    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff / 3600000) % 24);
    const minutes = Math.floor((diff / 60000) % 60);

    countdown.innerText = `${days} days • ${hours} hours • ${minutes} minutes remaining`;
}

setInterval(updateCountdown, 1000);
updateCountdown();

/* ===========================
   SIMPLE GREEN SPIRITS
=========================== */
const vortex = document.getElementById("vortex-container");
const SPIRIT_COUNT = 50;

function createSpirit() {
    const el = document.createElement("div");
    el.className = "spirit";
    el.textContent = "IMFT";

    resetSpirit(el);
    vortex.appendChild(el);

    return el;
}

function resetSpirit(el) {
    el.style.left = Math.random() * window.innerWidth + "px";
    el.style.top = Math.random() * window.innerHeight + "px";
    el.dataset.dx = (Math.random() - 0.5) * 0.4;
    el.dataset.dy = (Math.random() - 0.5) * 0.4;
}

const spirits = Array.from({ length: SPIRIT_COUNT }, createSpirit);

function animateSpirits() {
    spirits.forEach(el => {
        let x = parseFloat(el.style.left);
        let y = parseFloat(el.style.top);

        x += parseFloat(el.dataset.dx);
        y += parseFloat(el.dataset.dy);

        if (x < -50 || x > window.innerWidth + 50 ||
            y < -50 || y > window.innerHeight + 50) {
            resetSpirit(el);
        } else {
            el.style.left = x + "px";
            el.style.top = y + "px";
        }
    });

    requestAnimationFrame(animateSpirits);
}
animateSpirits();

/* ===========================
   CONTACT FORM SUBMIT (AJAX)
=========================== */
async function handleSubmit(e) {
    e.preventDefault();

    const token = grecaptcha.enterprise.getResponse();

    if (!token) {
        alert("Please complete the reCAPTCHA.");
        return false;
    }

    const email = document.getElementById("emailInput").value.trim();
    const message = document.getElementById("msgInput").value.trim();

    try {
        const res = await fetch("https://imformaltime-site.netlify.app/.netlify/functions/send-email", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                email,
                message,
                captchaToken: token
            })
        });

        const data = await res.json();
        alert(data.success ? "Message sent!" : "Failed to send message.");
    } catch (err) {
        alert("Error sending message.");
    }

    grecaptcha.enterprise.reset();
    return false;
}

/* ===========================
   GAME POPUP + FLAPPY BIRD
=========================== */
const gameModal = document.getElementById("gameModal");
const closeGame = document.getElementById("closeGame");
const gameButton = document.getElementById("gameButton");

gameButton.onclick = () => {
    gameModal.style.display = "flex";
    startGame();
};

closeGame.onclick = () => {
    gameModal.style.display = "none";
    stopGame();
};

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let bird, pipes, frameCount, score;
const gravity = 0.4;
const lift = -7.5;
const pipeWidth = 60;
const pipeGap = 140;
const pipeSpeed = 2.5;

function resetGame() {
    bird = { x: 80, y: canvas.height / 2, radius: 14, velocity: 0 };
    pipes = [];
    frameCount = 0;
    score = 0;
}

function addPipe() {
    const minHeight = 40;
    const maxHeight = canvas.height - pipeGap - minHeight;
    const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

    pipes.push({
        x: canvas.width,
        top: topHeight,
        bottom: topHeight + pipeGap,
        passed: false
    });
}

function drawBird() {
    ctx.fillStyle = "#ffeb3b";
    ctx.beginPath();
    ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
    ctx.fill();
}

function drawPipes() {
    ctx.fillStyle = "#4caf50";
    pipes.forEach(pipe => {
        ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
        ctx.fillRect(pipe.x, pipe.bottom, pipeWidth, canvas.height - pipe.bottom);
    });
}

function drawBackground() {
    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    gradient.addColorStop(0, "#70c5ce");
    gradient.addColorStop(1, "#ffffff");
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawScore() {
    ctx.fillStyle = "#ffffff";
    ctx.font = "24px Arial";
    ctx.fillText(score, canvas.width / 2 - 5, 40);
}

function updateGame() {
    frameCount++;

    bird.velocity += gravity;
    bird.y += bird.velocity;

    if (frameCount % 90 === 0) addPipe();

    pipes.forEach(pipe => pipe.x -= pipeSpeed);
    pipes = pipes.filter(pipe => pipe.x + pipeWidth > 0);

    pipes.forEach(pipe => {
        if (!pipe.passed && pipe.x + pipeWidth < bird.x) {
            pipe.passed = true;
            score++;
        }
    });

    if (bird.y + bird.radius > canvas.height || bird.y - bird.radius < 0) {
        gameOver();
        return;
    }

    for (let pipe of pipes) {
        if (
            bird.x + bird.radius > pipe.x &&
            bird.x - bird.radius < pipe.x + pipeWidth &&
            (bird.y - bird.radius < pipe.top || bird.y + bird.radius > pipe.bottom)
        ) {
            gameOver();
            return;
        }
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBackground();
    drawPipes();
    drawBird();
    drawScore();

    if (gameRunning) requestAnimationFrame(updateGame);
}

function flap() {
    bird.velocity = lift;
}

function gameOver() {
    gameRunning = false;
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#fff";
    ctx.font = "32px Arial";
    ctx.textAlign = "center";
    ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 10);
    ctx.font = "20px Arial";
    ctx.fillText("Click to play again", canvas.width / 2, canvas.height / 2 + 25);

    canvas.onclick = () => {
        canvas.onclick = null;
        startGame();
    };
}

let gameRunning = false;

function startGame() {
    resetGame();
    gameRunning = true;
    canvas.onclick = flap;
    window.onkeydown = e => { if (e.code === "Space") flap(); };
    updateGame();
}

function stopGame() {
    gameRunning = false;
    canvas.onclick = null;
    window.onkeydown = null;
}
</script>

</body>
</html>
