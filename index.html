<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IMFT – rReplay AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
/* SIDEBAR */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: 230px;
  height: 100vh;
  background: #0a0a0a;
  border-right: 1px solid #1a1a1a;
  padding-top: 20px;
  transform: translateX(-100%);
  transition: 0.25s ease;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.sidebar.open {
  transform: translateX(0);
}

.sidebar-header {
  display: flex;
  justify-content: flex-end;
  padding: 0 12px 20px 12px;
}

.hamburger {
  font-size: 1.4rem;
  cursor: pointer;
  color: var(--accent);
}

.sidebar-item {
  width: 100%;
  padding: 12px 16px;
  background: transparent;
  border: none;
  color: var(--text-main);
  font-size: 0.95rem;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}

.sidebar-item:hover {
  background: rgba(76, 175, 80, 0.12);
}

.icon {
  font-size: 1.1rem;
}

/* HAMBURGER BUTTON */
.sidebar-toggle {
  position: fixed;
  top: 14px;
  left: 14px;
  z-index: 10000;
  background: #0a0a0a;
  border: 1px solid #1a1a1a;
  color: var(--accent);
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 1.2rem;
}

.sidebar-toggle:hover {
  background: rgba(76, 175, 80, 0.12);
}
.sidebar-main {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 40px; /* pushes Conversation down */
}

/* ABOUT + SETTINGS PAGE OVERLAY */
.page-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(5, 5, 5, 0.96);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 9000;
  display: none;
  flex-direction: column;
  padding: 40px;
  color: var(--text-main);
}

.page-overlay h1 {
  color: var(--accent);
  margin-bottom: 20px;
}

.page-overlay textarea {
  width: 100%;
  height: 200px;
  background: #0a0a0a;
  border: 1px solid #1a1a1a;
  color: var(--text-main);
  padding: 10px;
  border-radius: 8px;
  resize: none;
}

.page-overlay .closePage {
  margin-top: 20px;
  padding: 8px 14px;
  background: var(--accent);
  border: none;
  border-radius: 6px;
  cursor: pointer;
  color: #000;
  font-weight: bold;
}
.top-title {
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 0.03em;
  margin-left: 40px; /* pushes it right so it clears the hamburger */
}
.sidebar {
  display: flex;
  flex-direction: column;
  justify-content: space-between; /* pushes bottom items down */
  padding-bottom: 20px;
}

.sidebar-main {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.sidebar-bottom {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: auto; /* ensures it stays at the bottom */
}

:root {
      --bg-main: #050505;
      --bg-elevated: #101010;
      --bg-glass: rgba(20, 20, 20, 0.9);
      --accent: #4caf50;
      --accent-soft: #2f8f3a;
      --text-main: #f5f5f5;
      --text-muted: #aaaaaa;
      --border-subtle: #222;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      background: radial-gradient(circle at top, #0b1b0b 0%, #020302 55%, #000 100%);
    }

    /* TOP BAR */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: linear-gradient(to right, #050805, #050505);
      border-bottom: 1px solid var(--border-subtle);
      position: relative;
      z-index: 20;
    }

    .top-title {
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.03em;
    }

    .contact-btn {
      background: transparent;
      border: 1px solid var(--accent-soft);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .contact-btn:hover {
      background: rgba(76, 175, 80, 0.08);
    }

    /* CONTACT POPUP (GLASS) */
    .contact-popup {
      position: absolute;
      right: 16px;
      top: 110%;
      width: 260px;
      padding: 12px;
      background: var(--bg-glass);
      border-radius: 14px;
      border: 1px solid rgba(76, 175, 80, 0.3);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: none;
      flex-direction: column;
      gap: 8px;
      z-index: 30;
    }

    .contact-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    .contact-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
    }

    .contact-label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .contact-input,
    .contact-textarea {
      background: #050505;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      padding: 6px 8px;
      color: var(--text-main);
      font-size: 0.8rem;
      resize: vertical;
    }

    .contact-input:focus,
    .contact-textarea:focus {
      outline: none;
      border-color: var(--accent-soft);
    }

    .contact-recaptcha {
      margin-top: 4px;
    }

    .recaptcha-box {
      border-radius: 8px;
      border: 1px solid #444;
      padding: 6px 8px;
      background: #050505;
    }

    .recaptcha-title {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .recaptcha-error {
      margin-top: 4px;
      font-size: 0.7rem;
      color: #ff6b6b;
    }

    .contact-send {
      margin-top: 6px;
      width: 100%;
      padding: 6px 0;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: #000;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .contact-send:hover {
      background: #5ed15a;
    }

    /* CHAT AREA */
    .chat-wrapper {
      flex: 1;
      overflow: hidden;
      display: flex;
    }

    .chat-area {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      max-width: 80%;
      padding: 8px 11px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.4;
      animation: fadeIn 0.18s ease-out;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .msg.user {
      margin-left: auto;
      background: var(--accent);
      color: #000;
    }

    .msg.bot {
      margin-right: auto;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
    }

    /* Typing animation */
    .typing {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: blink 1.4s infinite both;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0% { opacity: 0.2; transform: translateY(0); }
      20% { opacity: 1; transform: translateY(-3px); }
      100% { opacity: 0.2; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* BOTTOM BAR */
    .bottom-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-top: 1px solid var(--border-subtle);
      background: linear-gradient(to top, #050505, #050505f0);
    }

    .bottom-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: #050505;
      color: var(--text-main);
      font-size: 1rem;
      cursor: pointer;
    }

    .icon-btn:hover {
      border-color: var(--accent-soft);
    }

    /* MODEL DROPDOWN */
    .model-dropdown {
      position: relative;
    }

    .model-trigger {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: #050505;
      color: var(--text-main);
      cursor: pointer;
      min-width: 190px;
    }

    .model-trigger-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .model-trigger-text span {
      font-size: 0.8rem;
      font-weight: 500;
    }

    .model-trigger-text small {
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    .chevron {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-left: auto;
    }

    .model-menu {
      position: absolute;
      left: 0;
      top: 110%;
      min-width: 220px;
      background: #050505;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.7);
      padding: 4px;
      display: none;
      flex-direction: column;
      z-index: 25;
    }

    .model-item {
      text-align: left;
      padding: 6px 8px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .model-item:hover {
      background: rgba(76, 175, 80, 0.12);
    }

    .model-title {
      font-size: 0.8rem;
    }

    .model-sub {
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    /* INPUT */
    .bottom-input {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #chatInput {
      flex: 1;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: #050505;
      color: var(--text-main);
      padding: 8px 12px;
      font-size: 0.9rem;
    }

    #chatInput:focus {
      outline: none;
      border-color: var(--accent-soft);
    }

    .send-btn {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: #000;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .send-btn:hover {
      background: #5ed15a;
    }

    /* PAGE FOOTER */
    .page-footer {
      text-align: center;
      padding: 6px 10px;
      font-size: 0.75rem;
      color: var(--accent);
      border-top: 1px solid var(--border-subtle);
      background: #050505;
    }

    /* RESPONSIVE */
    @media (max-width: 700px) {
      .top-bar {
        padding: 8px 10px;
      }

      .chat-area {
        padding: 10px;
      }

      .bottom-bar {
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
      }

      .bottom-left {
        justify-content: flex-start;
      }

      .model-trigger {
        min-width: 0;
      }

      .contact-popup {
        width: 90vw;
        right: 5vw;
      }
    }
  </style>
</head>
<body>
<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">

  <div class="sidebar-main">
    <button class="sidebar-item" id="navConversation">
      <span class="icon">💬</span>
      Conversation
    </button>
  </div>

  <div class="sidebar-bottom">
    <button class="sidebar-item" id="navAbout">
      <span class="icon">ℹ️</span>
      About
    </button>

    <button class="sidebar-item" id="navSettings">
      <span class="icon">⚙️</span>
      Settings
    </button>
  </div>

</div>



<!-- HAMBURGER BUTTON (TOP LEFT OVERLAY) -->
<button id="sidebarToggle" class="sidebar-toggle">☰</button>

<div id="app">
    <!-- TOP BAR -->
    <header class="top-bar">
      <div class="top-title">IMFT | Chat with rReplay</div>

      <button id="contactToggle" class="contact-btn">Contact Me</button>

      <!-- CONTACT POPUP -->
      <div id="contactPopup" class="contact-popup">
        <div class="contact-header">
          <span>Contact Me</span>
          <button id="contactClose" class="contact-close">✕</button>
        </div>

        <label class="contact-label">
          Your email
          <input type="email" id="contactEmail" class="contact-input" placeholder="you@example.com">
        </label>

        <label class="contact-label">
          Your message
          <textarea id="contactMessage" class="contact-textarea" rows="3" placeholder="Type your message..."></textarea>
        </label>

        <div class="contact-recaptcha">
          <div class="recaptcha-box">
            <div class="recaptcha-title">reCAPTCHA</div>
            <div class="recaptcha-error">
              ERROR for site owner: Invalid domain for site key.
            </div>
          </div>
        </div>

        <button class="contact-send">Send</button>
      </div>
    </header>

    <!-- CHAT AREA -->
    <main class="chat-wrapper">
      <div id="chatArea" class="chat-area"></div>
    </main>

    <!-- BOTTOM INPUT BAR -->
    <footer class="bottom-bar">
      <div class="bottom-left">
        <button class="icon-btn" id="plusBtn">+</button>

        <!-- CUSTOM MODEL DROPDOWN -->
        <div class="model-dropdown" id="modelDropdown">
          <button class="model-trigger" id="modelTrigger">
            <div class="model-trigger-text">
              <span id="modelLabel">rReplay BETA 0.1</span>
              <small>Empowered by llama-3.1-8b-instant</small>
            </div>
            <span class="chevron">▾</span>
          </button>
          <div class="model-menu" id="modelMenu">
            <button class="model-item" data-model="rReplay BETA 0.1">
              <span class="model-title">rReplay BETA 0.1</span>
              <small class="model-sub">Empowered by llama-3.1-8b-instant</small>
            </button>
            <button class="model-item" data-model="rReplay BETA R1">
              <span class="model-title">rReplay BETA R1</span>
              <small class="model-sub">Empowered by llama-3.1-8b-instant</small>
            </button>
          </div>
        </div>
      </div>

      <div class="bottom-input">
        <input id="chatInput" type="text" placeholder="Send a message..." autocomplete="off">
        <button id="sendBtn" class="send-btn">➤</button>
      </div>
    </footer>

    <!-- PAGE FOOTER -->
    <div class="page-footer">
      <span>Powered by rReplay AI BETA 0.1</span>
    </div>
  </div>

  <script>
/* === AI PERSONALITY (EDIT THIS) === */
const AI_PERSONALITY = `
<!-- type your personality here -->

You are rReplay, an intelligent, friendly, neon‑green themed AI assistant.
You speak clearly, helpfully, and with confidence.
You keep answers short and simple unless the user asks for detail.
You never break character.
You, the AI on imformaltime.com were made by Eidan, a developer who loves coding. You, the AI model itself were developed by Meta.

`;

/* BACKEND CALL */
async function sendMessage(message) {
  const response = await fetch("https://llama-backend-1-qq3f.onrender.com/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      message: AI_PERSONALITY + "\nUser: " + message
    })
  });

  const data = await response.json();
  return data.reply;
}

/* DOM ELEMENTS */
const chatArea = document.getElementById("chatArea");
const chatInput = document.getElementById("chatInput");
const sendBtn = document.getElementById("sendBtn");

/* CONTACT POPUP */
const contactToggle = document.getElementById("contactToggle");
const contactPopup = document.getElementById("contactPopup");
const contactClose = document.getElementById("contactClose");

/* MODEL DROPDOWN */
const modelTrigger = document.getElementById("modelTrigger");
const modelMenu = document.getElementById("modelMenu");
const modelLabel = document.getElementById("modelLabel");
const modelItems = document.querySelectorAll(".model-item");
const modelDropdown = document.getElementById("modelDropdown");

/* SIDEBAR */
const sidebar = document.getElementById("sidebar");
const sidebarToggle = document.getElementById("sidebarToggle");

/* SIDEBAR TOGGLE (hamburger opens/closes) */
sidebarToggle.onclick = () => {
  sidebar.classList.toggle("open");
};

/* PAGE OVERLAY SYSTEM */
function openPage(title, contentHTML) {
  let overlay = document.getElementById("pageOverlay");

  if (!overlay) {
    overlay = document.createElement("div");
    overlay.id = "pageOverlay";
    overlay.className = "page-overlay";
    document.body.appendChild(overlay);
  }

  overlay.innerHTML = `
    <h1>${title}</h1>
    ${contentHTML}
    <button class="closePage">Close</button>
  `;

  overlay.style.display = "flex";

  overlay.querySelector(".closePage").onclick = () => {
    overlay.style.display = "none";
  };
}

/* NAVIGATION BUTTONS */
document.getElementById("navConversation").onclick = () => {
  sidebar.classList.remove("open");
};

document.getElementById("navAbout").onclick = () => {
  sidebar.classList.remove("open");

  openPage(
    "About",
    `
      <p>
        <!-- type your message here -->
        Hello from rReplay! rReplay is a small AI model developed by me (duh), and can do some basic tasks. Heres one tip: Don't ask it to code anything for you! rReplay is TERRIBLE at coding!
      </p>
    `
  );
};

document.getElementById("navSettings").onclick = () => {
  sidebar.classList.remove("open");

  openPage(
    "Settings",
    `<p>Coming Soon...</p>`
  );
};

/* CHAT LOGIC */
async function handleSend() {
  const text = chatInput.value.trim();
  if (!text) return;

  chatArea.innerHTML += `<div class="msg user">${escapeHtml(text)}</div>`;
  chatInput.value = "";
  scrollChatToBottom();

  const typingId = "typing-" + Date.now();
  chatArea.innerHTML += `
    <div class="msg bot" id="${typingId}">
      <div class="typing">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div>
  `;
  scrollChatToBottom();

  try {
    const reply = await sendMessage(text);
    const typingEl = document.getElementById(typingId);
    if (typingEl) typingEl.remove();

    chatArea.innerHTML += `<div class="msg bot">${escapeHtml(reply)}</div>`;
    scrollChatToBottom();
  } catch (err) {
    const typingEl = document.getElementById(typingId);
    if (typingEl) typingEl.remove();

    chatArea.innerHTML += `<div class="msg bot">Sorry, something went wrong talking to rReplay.</div>`;
    scrollChatToBottom();
  }
}

function scrollChatToBottom() {
  chatArea.scrollTop = chatArea.scrollHeight;
}

function escapeHtml(str) {
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

/* SEND EVENTS */
sendBtn.addEventListener("click", handleSend);
chatInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

/* CONTACT POPUP TOGGLE */
contactToggle.addEventListener("click", (e) => {
  e.stopPropagation();
  const isOpen = contactPopup.style.display === "flex";
  contactPopup.style.display = isOpen ? "none" : "flex";
});

contactClose.addEventListener("click", (e) => {
  e.stopPropagation();
  contactPopup.style.display = "none";
});

document.addEventListener("click", (e) => {
  if (!contactPopup.contains(e.target) && !contactToggle.contains(e.target)) {
    contactPopup.style.display = "none";
  }
});

/* MODEL DROPDOWN */
modelTrigger.addEventListener("click", (e) => {
  e.stopPropagation();
  const isOpen = modelMenu.style.display === "flex";
  modelMenu.style.display = isOpen ? "none" : "flex";
});

modelItems.forEach((item) => {
  item.addEventListener("click", () => {
    const modelName = item.getAttribute("data-model");
    modelLabel.textContent = modelName;
    modelMenu.style.display = "none";
  });
});

document.addEventListener("click", (e) => {
  if (!modelDropdown.contains(e.target)) {
    modelMenu.style.display = "none";
  }
});


  </script>
</body>
</html>
